name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appstore_spy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Dummy secrets so the app package imports and the auth/config gates pass.
      JWT_SECRET: ci-test-secret
      ADMIN_TOKEN: ci-admin-token
      # Enables the Postgres-backed integration tests (test_country_aware.py).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/appstore_spy
      # The app's SessionLocal (used by the atomic usage-counter tests) reads this.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/appstore_spy

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run test suite
        # --timeout so a hung test fails fast instead of stalling CI (quarantined
        # slow/network tests then land as xfail via tests/conftest.py).
        run: python -m pytest -p no:cacheprovider -q --timeout=60

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx next build
